<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrezzHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f1a;--panel:#181a2b;--line:#2a2d45;--tx:#f2f3fa;--mute:#9a9db8;--ac:#ff7a1a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Outfit,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px}.logo span{color:var(--ac)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:12px 4vw;background:linear-gradient(var(--bg),#0e0f1ae6);backdrop-filter:blur(8px);flex-wrap:wrap}
nav a.t{color:var(--mute);padding:4px 0;border-bottom:2px solid transparent}
nav a.t.on{color:var(--tx);border-color:var(--ac)}
nav .sp{flex:1}
nav input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;width:200px}
.btn{background:var(--ac);color:#1a0d00;border:0;border-radius:6px;padding:9px 18px;font-weight:600;cursor:pointer}
.btn.g{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
main{padding:0 4vw 60px}
.hero{position:relative;margin:0 -4vw 28px;min-height:62vh;display:flex;align-items:flex-end;padding:4vw;background-size:cover;background-position:center top}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),#0e0f1a99 45%,#0e0f1a33),linear-gradient(90deg,#0e0f1acc,transparent 60%)}
.hero div{position:relative;max-width:560px}
.hero h1{font-size:clamp(30px,5vw,56px);line-height:1.05;font-weight:800;margin-bottom:10px}
.hero p{color:#cfd1e6;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
h2{font-size:22px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:14px;color:var(--mute)}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.row .c{flex:0 0 160px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.c{display:block;position:relative}
.c img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);display:block;transition:transform .15s}
.c:hover img{transform:scale(1.04)}
.c b{display:block;font-weight:600;font-size:14px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c i{font-style:normal;color:var(--mute);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--panel);border:1px solid var(--line);padding:5px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:#1a0d00;border-color:var(--ac)}
.det{display:grid;grid-template-columns:240px 1fr;gap:28px;margin-top:24px}
.det img.p{width:100%;border-radius:10px}
.det h1{font-size:34px;line-height:1.1;margin-bottom:8px}
.det p{color:#cfd1e6;max-width:70ch;margin:10px 0}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.eps a{background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:6px;font-size:14px}
.eps a:hover{border-color:var(--ac)}
.player{aspect-ratio:16/9;width:100%;border:0;border-radius:10px;background:#000;margin-top:16px}
.rd{max-width:820px;margin:16px auto}.rd img{width:100%;display:block}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 70% 0,#ff7a1a22,transparent),var(--bg)}
.auth form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:12px}
.auth input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
.err{color:#ff8a8a;font-size:14px;min-height:20px}
.mute{color:var(--mute)}
.vb{vertical-align:-3px;margin-left:5px}
.skel{height:200px;display:grid;place-items:center;color:var(--mute)}
@media(max-width:700px){.det{grid-template-columns:1fr}.det img.p{max-width:200px}nav input{width:130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = {monday:'Senin',tuesday:'Selasa',wednesday:'Rabu',thursday:'Kamis',friday:'Jumat',saturday:'Sabtu',sunday:'Minggu'};
const GENRES = ['action','adventure','comedy','drama','fantasy','romance','school','sci-fi','slice-of-life','supernatural','mystery','horror','isekai','sports','mecha','music'];

/* ---------- helpers: toleran terhadap bentuk JSON ---------- */
async function api(kind, ep, q = {}) {
  const r = await fetch(`/api/p/${kind}/${ep}?` + new URLSearchParams(q));
  return r.json().catch(() => ({}));
}
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function list(d, d0 = 0) { // array objek pertama yang ditemukan (BFS)
  const q = [d];
  while (q.length) { const x = q.shift();
    if (Array.isArray(x) && x.length && isObj(x[0])) return x;
    if (isObj(x)) q.push(...Object.values(x)); else if (Array.isArray(x)) q.push(...x); }
  return [];
}
function arrKey(d, re) { // array di key yang cocok regex
  const q = [d];
  while (q.length) { const x = q.shift();
    if (isObj(x)) for (const [k, v] of Object.entries(x)) {
      if (re.test(k) && Array.isArray(v) && v.length) return v;
      if (v && typeof v === 'object') q.push(v); } }
  return [];
}
const pick = (o, keys) => { for (const k of keys) if (o?.[k] != null && typeof o[k] !== 'object' && o[k] !== '') return o[k]; return ''; };
const T = o => pick(o, ['title','name','judul','anime_title','manga_title','chapter_title']) || 'Tanpa judul';
const I = o => pick(o, ['poster','image','thumbnail','cover','cover_image_url','cover_url','img','thumb','poster_url','image_url']);
const S = o => { const v = pick(o, ['slug','manga_id','id','chapter_id','anime_id']);
  if (v) return v; const u = pick(o, ['url','link','href']); return String(u).split('/').filter(Boolean).pop() || ''; };
const sub = o => pick(o, ['episode','latest_episode','latest_chapter_number','latest_chapter','type','status','score','rating']);
const detail = d => { const x = d?.data ?? d; return isObj(x?.data) ? x.data : x; };
function strings(d, re, out = []) { // kumpulkan URL http dari key yang cocok
  if (isObj(d)) for (const [k, v] of Object.entries(d)) {
    if (typeof v === 'string' && /^https?:\/\//.test(v) && re.test(k) && !/\.(jpe?g|png|webp|gif)(\?|$)/i.test(v)) out.push([k, v]);
    else if (v && typeof v === 'object') strings(v, re, out); }
  else if (Array.isArray(d)) d.forEach(v => strings(v, re, out));
  return out;
}
function images(d, out = []) {
  if (typeof d === 'string') { if (/^https?:\/\/.+\.(jpe?g|png|webp|gif)(\?|$)/i.test(d)) out.push(d); }
  else if (d && typeof d === 'object') Object.values(d).forEach(v => images(v, out));
  return out;
}
const card = (o, kind) => { const s = sub(o);
  return `<a class="c" href="#/${kind}/${encodeURIComponent(S(o))}"><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(I(o))}"><b>${esc(T(o))}</b><i>${esc(s)}</i></a>`; };
const empty = m => `<p class="skel">${m || 'Tidak ada data.'}</p>`;

/* ---------- shell & router ---------- */
function shell() {
  app.innerHTML = `<nav>
    <a class="logo" href="#/">Trezz<span>Hub</span></a>
    <a class="t" data-k="anime" href="#/">Anime</a>
    <a class="t" data-k="schedule" href="#/schedule/monday">Jadwal</a>
    <a class="t" data-k="komik" href="#/komik">Komik</a>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="Cari anime atau komik">
</nav><main id="m"></main>`;
  $('#q').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) {
    const k = location.hash.startsWith('#/komik') || location.hash.startsWith('#/k/') || location.hash.startsWith('#/read') ? 'komik' : 'anime';
    location.hash = `#/search/${k}/${encodeURIComponent(e.target.value.trim())}`; } };
}
function tab(k) { document.querySelectorAll('nav .t').forEach(a => a.classList.toggle('on', a.dataset.k === k)); }
const M = h => $('#m').innerHTML = h;

async function route() {
  const [, r, a, b] = location.hash.split('/').map(decodeURIComponent);
  scrollTo(0, 0);
  M(empty('Memuat…'));
  try {
    if (!r) return home();
    if (r === 'schedule') return schedule(a || 'monday');
    if (r === 'list') return gridPage(a, 'anime');
    if (r === 'genre') return genre(a || 'action');
    if (r === 'a') return animeDetail(a);
    if (r === 'watch') return watch(a);
    if (r === 'komik') return komikHome();
    if (r === 'k') return komikDetail(a);
    if (r === 'read') return read(a, b);
    if (r === 'search') return gridPage('search', a, b);
    if (r === 'klist') return gridPage('klist', 'komik');
    M(empty('Halaman tidak ditemukan.'));
  } catch (e) { if (e !== 0) M(empty('Gagal memuat data. Coba lagi sebentar.')); }
}

/* ---------- anime ---------- */
const row = (title, items, kind, more) => items.length ? `<h2>${title}${more ? `<a href="${more}">Lihat semua</a>` : ''}</h2><div class="row">${items.slice(0, 20).map(o => card(o, kind)).join('')}</div>` : '';
async function home() {
  tab('anime');
  const [h, t, o, c, bt] = await Promise.all(['home', 'terbaru', 'ongoing', 'completed', 'batch'].map(e => api('anime', e, { page: 1 })));
  const lh = list(h), lt = list(t), lo = list(o), lc = list(c), lb = list(bt);
  const hero = (lh[0] || lo[0] || lt[0]);
  M(`${hero ? `<section class="hero" style="background-image:url('${esc(I(hero))}')"><div>
      <h1>${esc(T(hero))}</h1><p>${esc(pick(hero, ['synopsis','description','sinopsis']) || sub(hero))}</p>
      <a class="btn" href="#/a/${encodeURIComponent(S(hero))}">Tonton sekarang</a></div></section>` : ''}
    <div class="chips">${GENRES.map(g => `<a class="chip" href="#/genre/${g}">${g}</a>`).join('')}</div>
    ${row('Populer di beranda', lh.slice(1), 'a')}${row('Episode terbaru', lt, 'a', '#/list/terbaru')}
    ${row('Sedang tayang', lo, 'a', '#/list/ongoing')}${row('Tamat', lc, 'a', '#/list/completed')}${row('Batch', lb, 'a', '#/list/batch')}`);
}
async function gridPage(ep, kind, extra) {
  tab(kind); let page = 1;
  const titles = { terbaru:'Episode terbaru', ongoing:'Sedang tayang', completed:'Tamat', batch:'Batch', klist:'Semua komik', search:`Hasil untuk "${extra}"` };
  M(`<h2>${esc(titles[ep] || ep)}</h2><div class="grid" id="g"></div><p class="skel" id="mr"></p>`);
  const load = async () => {
    let d;
    if (ep === 'search') d = kind === 'komik' ? await api('komik', 'search', { q: extra, page, page_size: 24 }) : await api('anime', 'search', { query: extra, page });
    else if (ep === 'klist') d = await api('komik', 'list', { page, page_size: 24, sort: 'latest', sort_order: 'desc' });
    else if (ep.startsWith('genre:')) d = await api('anime', 'genre', { slug: ep.slice(6), page });
    else d = await api('anime', ep, { page });
    const l = list(d), k = kind === 'komik' ? 'k' : 'a';
    $('#g').insertAdjacentHTML('beforeend', l.map(o => card(o, k)).join(''));
    if (page === 1 && !l.length) $('#g').innerHTML = empty('Tidak ada hasil.');
    $('#mr').innerHTML = l.length ? '<button class="btn g" id="more">Muat lagi</button>' : '';
    if (l.length) $('#more').onclick = () => { page++; load(); };
  };
  await load();
}
async function genre(g) {
  tab('anime');
  await gridPage('genre:' + g, 'anime');
  $('#m').insertAdjacentHTML('afterbegin', `<div class="chips">${GENRES.map(x => `<a class="chip${x === g ? ' on' : ''}" href="#/genre/${x}">${x}</a>`).join('')}</div>`);
}
async function schedule(day) {
  tab('schedule');
  const d = await api('anime', 'schedule', { day });
  M(`<div class="chips">${Object.entries(DAYS).map(([k, v]) => `<a class="chip${k === day ? ' on' : ''}" href="#/schedule/${k}">${v}</a>`).join('')}</div>
    <div class="grid">${list(d).map(o => card(o, 'a')).join('') || empty('Tidak ada jadwal hari ini.')}</div>`);
}
async function animeDetail(slug) {
  tab('anime');
  const d = await api('anime', 'detail', { slug }), x = detail(d);
  const eps = arrKey(d, /episode|chapter/i).length ? arrKey(d, /episode|chapter/i) : list(d);
  const genres = arrKey(d, /genre/i).map(g => isObj(g) ? T(g) : g);
  M(`<div class="det"><img class="p" referrerpolicy="no-referrer" alt="" src="${esc(I(x))}"><div>
    <h1>${esc(T(x))}</h1><div class="chips">${genres.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div>
    <p>${esc(pick(x, ['synopsis','description','sinopsis']))}</p>
    <p class="mute">${[pick(x, ['status']), pick(x, ['type']), pick(x, ['score','rating']), pick(x, ['released','season'])].filter(Boolean).map(esc).join(' • ')}</p>
    <h2>Episode</h2><div class="eps">${eps.map(e => `<a href="#/watch/${encodeURIComponent(S(e))}">${esc(pick(e, ['episode','number','title','name']) || S(e))}</a>`).join('') || empty('Belum ada episode.')}</div></div></div>`);
}
async function watch(slug) {
  tab('anime');
  const [w, e] = await Promise.all([api('anime', 'watch', { slug }), api('anime', 'episode', { slug })]);
  const re = /stream|embed|iframe|player|server|video|url|link/i;
  const seen = new Set(), src = [...strings(w, re), ...strings(e, re)].filter(([, u]) => !seen.has(u) && seen.add(u));
  const info = detail(e), nav = arrKey(e, /episode/i);
  M(`<h2>${esc(T(info) !== 'Tanpa judul' ? T(info) : slug)}</h2>
    ${src.length ? `<iframe id="pl" class="player" allowfullscreen referrerpolicy="no-referrer" src="${esc(src[0][1])}"></iframe>
    <div class="chips">${src.map(([k, u], i) => `<span class="chip${i ? '' : ' on'}" data-u="${esc(u)}">Server ${i + 1}</span>`).join('')}</div>` : empty('Sumber video tidak ditemukan untuk episode ini.')}
    ${nav.length ? `<h2>Episode lain</h2><div class="eps">${nav.map(n => `<a href="#/watch/${encodeURIComponent(S(n))}">${esc(pick(n, ['episode','number','title']) || S(n))}</a>`).join('')}</div>` : ''}`);
  document.querySelectorAll('.chip[data-u]').forEach(c => c.onclick = () => {
    $('#pl').src = c.dataset.u; document.querySelectorAll('.chip[data-u]').forEach(x => x.classList.toggle('on', x === c)); });
}

/* ---------- komik ---------- */
async function komikHome() {
  tab('komik');
  const [tr, tw, tm, ls] = await Promise.all([
    api('komik', 'trending', { filter: 'daily', page: 1, page_size: 10 }),
    api('komik', 'trending', { filter: 'weekly', page: 1, page_size: 10 }),
    api('komik', 'trending', { filter: 'monthly', page: 1, page_size: 10 }),
    api('komik', 'list', { page: 1, page_size: 24, sort: 'latest', sort_order: 'desc' })]);
  const a = list(tr), hero = a[0];
  M(`${hero ? `<section class="hero" style="background-image:url('${esc(I(hero))}')"><div><h1>${esc(T(hero))}</h1>
    <p>${esc(pick(hero, ['description','synopsis']))}</p><a class="btn" href="#/k/${encodeURIComponent(S(hero))}">Baca sekarang</a></div></section>` : ''}
    ${row('Trending hari ini', a, 'k')}${row('Trending minggu ini', list(tw), 'k')}${row('Trending bulan ini', list(tm), 'k')}
    ${row('Update terbaru', list(ls), 'k', '#/klist')}`);
}
async function komikDetail(id) {
  tab('komik');
  const [d, c] = await Promise.all([api('komik', 'detail', { manga_id: id }),
    api('komik', 'chapters', { manga_id: id, page: 1, page_size: 100, sort_order: 'desc' })]);
  const x = detail(d), chs = list(c), genres = arrKey(d, /genre/i).map(g => isObj(g) ? T(g) : g);
  M(`<div class="det"><img class="p" referrerpolicy="no-referrer" alt="" src="${esc(I(x))}"><div>
    <h1>${esc(T(x))}</h1><div class="chips">${genres.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div>
    <p>${esc(pick(x, ['description','synopsis','sinopsis']))}</p>
    <h2>Chapter</h2><div class="eps">${chs.map(ch => `<a href="#/read/${encodeURIComponent(pick(ch, ['chapter_id','id','slug']) || S(ch))}/${encodeURIComponent(id)}">${esc(pick(ch, ['chapter_number','chapter','title','name']) || S(ch))}</a>`).join('') || empty('Belum ada chapter.')}</div></div></div>`);
}
async function read(cid, mid) {
  tab('komik');
  const d = await api('komik', 'read', { chapter_id: cid }), imgs = [...new Set(images(d))];
  M(`<h2>${esc(cid)}<a href="#/k/${encodeURIComponent(mid || '')}">Kembali ke daftar chapter</a></h2>
    <div class="rd">${imgs.map(u => `<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(u)}">`).join('') || empty('Halaman chapter tidak ditemukan.')}</div>`);
}

/* ---------- boot ---------- */
addEventListener('hashchange', route);
shell();
route();
</script>
</body>
</html>
